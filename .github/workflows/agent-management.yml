name: Agent management gateway

on:
  pull_request:
    branches:
      - codex/personal-implementation-agent
    paths:
      - 'agent management/**'
      - 'ai_scientist/workbench/runtime.py'
      - 'ai_scientist/workbench/app.py'
      - 'tests/workbench/test_agent_management.py'
      - '.github/workflows/agent-management.yml'
  workflow_dispatch:

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated gateway test dependencies
        run: python -m pip install 'fastapi>=0.115,<1' 'pydantic>=2.8,<3' 'httpx>=0.27,<1' 'pytest>=8,<10'
      - name: Validate syntax
        run: python -m compileall -q 'agent management' ai_scientist/workbench/runtime.py ai_scientist/workbench/app.py
      - name: Test gateway and durable coordination
        run: python -m pytest tests/workbench/test_agent_management.py -q
